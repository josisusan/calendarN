# The openapi version string. For 3.1.0, this MUST be '3.1.0'.
openapi: 3.1.0
# The info object provides metadata about the API.
info:
  title: Simple API
  # A short summary of the API. New in OpenAPI 3.1.0.
  summary: A simple API to facilitate calendar service.
  description: |
    Calendar service
  version: 1.0.0

# An array of Server Objects, which provide connectivity information to a target server.
servers:
  - url: https://localhost:5001/calendarN
    description: Local server

# Tags are used for logical grouping of operations.
tags:
  - name: Calendar
    description: Operations related to CalendarN

# The available paths and operations for the API.
paths:
  /calendarN/today:
    get:
      summary: Returns today's calendar for both eng and nepali
      description: Returns today's calendar for both eng and nepali
      operationId: calendarToday
      tags:
        - Calendar
      responses:
        "200":
          description: calendar response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarResponse"
components:
  schemas:
    CalendarResponse:
      type: object
      properties:
        nepali:
          type: object
          allOf:
            - $ref: "#/components/schemas/DateResponse"
            - type: object
              properties:
                year_english:
                  type: integer
                month_english:
                  type: integer
                day_english:
                  type: integer
                week_day_english:
                  type: integer
        english:
          type: object
          allOf:
            - $ref: "#/components/schemas/DateResponse"
            - type: object
              properties:
                month_string:
                  type: string
                progress:
                  type: number
                  format: float
    DateResponse:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        day:
          type: integer
        full_date:
          type: string
        year_days:
          type: integer
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: An error code.
        message:
          type: string
          description: A human-readable error message.
      required:
        - code
        - message

  securitySchemes:
    # A common security scheme: API Key in the header
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key for authentication.

security:
  - ApiKeyAuth: []
